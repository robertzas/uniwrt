[package]
name = "uniwrt-engine"
description = "uniwrt engine: a node actor per node, live state, the event bus, telemetry intervals and status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
uniwrt-core.workspace = true
uniwrt-model.workspace = true
uniwrt-node.workspace = true
uniwrt-store.workspace = true

[dev-dependencies]
bytes.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# tests/agent.rs shares the node crate's OpenWrt helpers, which need it.
zeroize.workspace = true

[lints]
workspace = true
