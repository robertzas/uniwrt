[package]
name = "uniwrt-engine"
description = "uniwrt engine: a node actor per node, live state, the event bus, telemetry intervals and status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
uniwrt-clients.workspace = true
uniwrt-core.workspace = true
uniwrt-dns.workspace = true
uniwrt-events.workspace = true
uniwrt-feeds.workspace = true
thiserror.workspace = true
uniwrt-metrics.workspace = true
uniwrt-model.workspace = true
uniwrt-node.workspace = true
uniwrt-notify.workspace = true
uniwrt-render.workspace = true
uniwrt-rf.workspace = true
uniwrt-store.workspace = true
uniwrt-syslog.workspace = true
uniwrt-topo.workspace = true
uniwrt-uci.workspace = true
sha2.workspace = true

[dev-dependencies]
criterion.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# tests/agent.rs shares the node crate's OpenWrt helpers, which need it.
uniwrt-bench.workspace = true
uniwrt-sim.workspace = true
zeroize.workspace = true

[[bench]]
name = "ingest"
harness = false

[lints]
workspace = true
