[package]
name = "uniwrt"
description = "UniFi-class controller for OpenWrt mesh networks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build/main.rs"

[[bin]]
name = "uniwrt"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { workspace = true, features = ["catch-panic", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
uniwrt-core.workspace = true
uniwrt-store.workspace = true

[build-dependencies]
brotli.workspace = true
flate2.workspace = true
sha2.workspace = true

[dev-dependencies]
# Decoders that check the embedded variants against the originals.
brotli.workspace = true
flate2.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
