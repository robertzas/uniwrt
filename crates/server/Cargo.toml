[package]
name = "uniwrt"
description = "UniFi-class controller for OpenWrt mesh networks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build/main.rs"

[[bin]]
name = "uniwrt"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# HTTP/2 over TLS (ALPN h2) for the UI's many small assets.
axum = { workspace = true, features = ["http2"] }
bytes.workspace = true
clap.workspace = true
ipnet.workspace = true
rcgen.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# Demo mode's database lives in a temporary directory inside the data directory.
tempfile.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls.workspace = true
# Router::oneshot, for the plain HTTP listener's dispatch.
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["catch-panic", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
uniwrt-api.workspace = true
uniwrt-core.workspace = true
uniwrt-engine.workspace = true
uniwrt-model.workspace = true
uniwrt-node.workspace = true
uniwrt-sim.workspace = true
uniwrt-store.workspace = true
zeroize.workspace = true

[build-dependencies]
brotli.workspace = true
flate2.workspace = true
sha2.workspace = true

[dev-dependencies]
# Decoders that check the embedded variants against the originals.
brotli.workspace = true
flate2.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
