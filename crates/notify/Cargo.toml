[package]
name = "uniwrt-notify"
description = "uniwrt notifiers: alerts in words, rendered for ntfy, webhooks and email, sent over HTTP(S) and SMTP, and the policy that decides what to send"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
data-encoding.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
lettre.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
uniwrt-core.workspace = true
uniwrt-model.workspace = true
webpki-roots.workspace = true
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls.workspace = true

[lints]
workspace = true
