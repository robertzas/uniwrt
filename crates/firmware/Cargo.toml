[package]
name = "uniwrt-firmware"
description = "uniwrt firmware: OpenWrt's release and device catalog, and zero-touch images built by ASU (Attended Sysupgrade) with the role's packages and the first-boot script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A fake ASU on loopback (`testing::FakeAsu`), for this crate's tests and the API's.
testing = ["dep:axum", "tokio/net", "tokio/rt"]

[dependencies]
axum = { workspace = true, optional = true }
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
uniwrt-model.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
