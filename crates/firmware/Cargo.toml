[package]
name = "uniwrt-firmware"
description = "uniwrt firmware: OpenWrt's release and device catalog, and zero-touch and upgrade images built by ASU (Attended Sysupgrade), official images, uploaded ones and GitHub releases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A fake ASU on loopback (`testing::FakeAsu`), for this crate's tests and the API's.
testing = ["dep:axum", "tokio/net", "tokio/rt"]
# The entry points of the fuzz targets (`fuzz/`, D-150): readers the crate doesn't export.
fuzzing = []

[dependencies]
axum = { workspace = true, optional = true }
bytes.workspace = true
# Base64 and hex in Sigstore bundles.
data-encoding.workspace = true
# The controller's release tarball (gzip).
flate2.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-rustls.workspace = true
rustls-webpki.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
tracing.workspace = true
uniwrt-core.workspace = true
uniwrt-model.workspace = true
webpki-roots.workspace = true
x509-parser.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
