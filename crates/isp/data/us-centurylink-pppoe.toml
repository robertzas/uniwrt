id = "us-centurylink-pppoe"
name = "CenturyLink (legacy)"
variant = "PPPoE"
country = "US"
status = "community"
sources = [
  "https://minus273.org/project/openwrt-centurylink/",
  "https://bidetly.io/2020/03/20/centurylink-fiber-on-pfsense/",
  "https://lists.freebsd.org/pipermail/freebsd-net/2018-May/050648.html",
]
notes = "Older CenturyLink lines: PPPoE on VLAN 201 (fiber; DSL lines may be untagged), with the username and password from CenturyLink. IPv6 is 6rd."
prompts = ["username", "password"]

[ipv4]
proto = "pppoe"
vlan = 201
mtu = 1492

[ipv6]
mode = "6rd"

[ipv6.sixrd]
prefix = "2602::/24"
border_relay = "205.171.2.64"
ipv4_mask_len = 0

[hints]
address = "No PPPoE session on VLAN 201. CenturyLink usernames end in @centurylink.net; newer Quantum Fiber lines use IPoE instead."
