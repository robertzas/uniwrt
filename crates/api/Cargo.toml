[package]
name = "uniwrt-api"
description = "uniwrt's HTTP API: axum routes, problem+json errors, authentication and sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
axum.workspace = true
data-encoding.workspace = true
ring.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
ts-rs.workspace = true
uniwrt-core = { workspace = true, features = ["ts"] }
uniwrt-engine.workspace = true
uniwrt-model = { workspace = true, features = ["ts"] }
uniwrt-node.workspace = true
uniwrt-store.workspace = true
zeroize.workspace = true

[dev-dependencies]
# HTTP/2, as the server serves it, for WebSockets over extended CONNECT.
axum = { workspace = true, features = ["http2"] }
futures-util = { workspace = true, features = ["sink"] }
hyper = { workspace = true, features = ["client", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
tempfile.workspace = true
tokio-tungstenite = { workspace = true, features = ["handshake"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }
uniwrt-sim.workspace = true

[lints]
workspace = true
