# The fuzz targets (M9.3b, D-150): cargo-fuzz (libFuzzer) on a nightly toolchain, outside the
# workspace so the product stays on stable. `just fuzz` runs them (scripts/fuzz.sh), CI's `fuzz`
# job briefly on every push, `.github/workflows/fuzz.yml` longer each week. Cargo.lock is the
# workspace's, copied in before each build (gitignored here), so the targets fuzz the versions
# that ship.
[package]
name = "uniwrt-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = { version = "1", features = ["raw_value"] }
uniwrt-core = { path = "../crates/core" }
uniwrt-dns = { path = "../crates/dns" }
uniwrt-feeds = { path = "../crates/feeds" }
uniwrt-firmware = { path = "../crates/firmware", features = ["fuzzing"] }
uniwrt-import = { path = "../crates/import" }
uniwrt-model = { path = "../crates/model" }
uniwrt-node = { path = "../crates/node", features = ["fuzzing"] }
uniwrt-syslog = { path = "../crates/syslog" }
uniwrt-uci = { path = "../crates/uci" }

# Not a member of the repository's workspace.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "syslog"
path = "fuzz_targets/syslog.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_queries"
path = "fuzz_targets/dns_queries.rs"
