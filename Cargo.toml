[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0" # CI injects the release version at build time (BUILD.md)
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robertzas/uniwrt"
publish = false

[workspace.dependencies]
uniwrt-core = { path = "crates/core" }
uniwrt-engine = { path = "crates/engine" }
uniwrt-model = { path = "crates/model" }
uniwrt-node = { path = "crates/node" }
uniwrt-sim = { path = "crates/sim" }
uniwrt-store = { path = "crates/store" }

anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1"
# The vault's AEAD (features/security.md); chacha20 and poly1305 are already in the tree through russh.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
# Base64 of binary agent output (bridge FDBs); already in the tree through russh.
data-encoding = "2.11.1"
ipnet = { version = "2.12.2", features = ["serde"] }
# SQLite compiled in (D-001, D-009): a static binary has no system library to link.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }
# Key generation, HKDF and digests; already in the tree through russh.
ring = "0.17.14"
# The controller's local CA and its leaf certificates (D-039); ring, not aws-lc-rs (deny.toml).
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
# TLS on the HTTPS listener, with the ring provider.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# SSH client (D-003). ring, not aws-lc-rs (deny.toml); no RSA: OpenWrt's dropbear has ed25519
# host keys, and the rsa crate carries an unfixed timing advisory (D-032).
russh = { version = "0.64.1", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# Certificate validity times, as rcgen takes them; already in the tree through rcgen.
time = { version = "0.3.55", default-features = false }
tokio = "1.54.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
zeroize = "1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# TypeScript types for API DTOs (D-017); exported into web/src/api/gen by `cargo test`.
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }
# Build-time asset compression (crates/server/build)
brotli = "9.0.0"
flate2 = "1.1.10"
sha2 = "0.11.1"
# Tests
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind" # one task's panic must not take down the server
opt-level = 3    # vs "s": 13-25 % less CPU per request for 0.5 MB more binary (D-028)

# build.rs precompresses the UI; unoptimized compressors would take minutes.
# Named packages take precedence over build-override, which defaults to opt-level 0.
[profile.dev.package.brotli]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.release.package.brotli]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
