[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0" # CI injects the release version at build time (BUILD.md)
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robertzas/uniwrt"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = "1.54.1"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Build-time asset compression (crates/server/build)
brotli = "9.0.0"
flate2 = "1.1.10"
sha2 = "0.11.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind" # one task's panic must not take down the server
opt-level = 3    # compared against "s" in M0.4

# build.rs precompresses the UI; unoptimized compressors would take minutes.
# Named packages take precedence over build-override, which defaults to opt-level 0.
[profile.dev.package.brotli]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.release.package.brotli]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
