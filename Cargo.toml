[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0" # CI injects the release version at build time (BUILD.md)
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robertzas/uniwrt"
publish = false

[workspace.dependencies]
uniwrt-api = { path = "crates/api" }
uniwrt-clients = { path = "crates/clients" }
uniwrt-core = { path = "crates/core" }
uniwrt-engine = { path = "crates/engine" }
uniwrt-events = { path = "crates/events" }
uniwrt-jobs = { path = "crates/jobs" }
uniwrt-metrics = { path = "crates/metrics" }
uniwrt-model = { path = "crates/model" }
uniwrt-node = { path = "crates/node" }
uniwrt-notify = { path = "crates/notify" }
uniwrt-sim = { path = "crates/sim" }
uniwrt-store = { path = "crates/store" }
uniwrt-syslog = { path = "crates/syslog" }
uniwrt-import = { path = "crates/import" }
uniwrt-render = { path = "crates/render" }
uniwrt-rf = { path = "crates/rf" }
uniwrt-isp = { path = "crates/isp" }
uniwrt-topo = { path = "crates/topo" }
uniwrt-uci = { path = "crates/uci" }

anyhow = "1.0.104"
# Password hashing (Argon2id); already in the tree through ssh-key. Salts come from ring.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1"
# The vault's AEAD (features/security.md); chacha20 and poly1305 are already in the tree through russh.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
# Base64 of binary agent output (bridge FDBs); already in the tree through russh.
data-encoding = "2.11.1"
ipnet = { version = "2.12.2", features = ["serde"] }
# SQLite compiled in (D-001, D-009): a static binary has no system library to link.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "cache"] }
# Key generation, HKDF and digests; already in the tree through russh.
ring = "0.17.14"
# The controller's local CA and its leaf certificates (D-039); ring, not aws-lc-rs (deny.toml).
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
# TLS on the HTTPS listener, with the ring provider.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# SSH client (D-003). ring, not aws-lc-rs (deny.toml); no RSA: OpenWrt's dropbear has ed25519
# host keys, and the rsa crate carries an unfixed timing advisory (D-032).
russh = { version = "0.65.0", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Log annotations (crates/syslog): the patterns' regexes, and the TOML file they come from.
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
thiserror = "2.0.21"
# Certificate validity times, as rcgen takes them; already in the tree through rcgen.
time = { version = "0.3.55", default-features = false }
tokio = "1.54.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
zeroize = "1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# TypeScript types for API DTOs (D-017); exported into web/src/api/gen by `cargo test`.
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
# Build-time asset compression (crates/server/build)
brotli = "9.1.1"
flate2 = "1.1.10"
# Inflating the embedded vendor table (crates/clients); already in the tree through flate2.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
sha2 = "0.11.1"
# Tests
# Golden files of rendered UCI (crates/render/tests); review changes with `cargo insta review`.
insta = { version = "1.49.0", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
# A WebSocket client for the API's tests: the version axum's ws feature brings.
tokio-tungstenite = { version = "0.29.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
# An HTTP/2 client for the API's test of WebSockets over extended CONNECT (RFC 8441).
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
# Notifiers (crates/notify): webhooks and ntfy over HTTPS with rustls on ring and Mozilla's roots,
# email over SMTP with lettre (D-061, D-063); hyper and http-body-util are already in the tree.
http-body-util = "0.1.5"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
webpki-roots = "1.0.11"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind" # one task's panic must not take down the server
opt-level = 3    # vs "s": 13-25 % less CPU per request for 0.5 MB more binary (D-028)

# build.rs precompresses the UI; unoptimized compressors would take minutes.
# Named packages take precedence over build-override, which defaults to opt-level 0.
[profile.dev.package.brotli]
opt-level = 3
# Argon2id at its production cost takes seconds unoptimized; logins in `just dev` should not.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.release.package.brotli]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
