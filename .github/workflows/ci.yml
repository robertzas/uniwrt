# CI/CD (docs/dev/BUILD.md): every push and pull request builds and tests; a push to main also
# publishes the image and the GitHub release. Actions are pinned by commit SHA (Dependabot).
name: CI

on:
  push:
    # Dependabot's branches get CI through their pull requests.
    branches: ["**", "!dependabot/**"]
  pull_request:
  workflow_dispatch:

# One run per ref. On main, runs queue instead of cancelling, so releases stay in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

defaults:
  run:
    shell: bash # unlike the implicit default, this adds -o pipefail

env:
  CARGO_TERM_COLOR: always
  # Keep in line with the local tools: bun in docs/STATUS.md, zig in scripts/cross.sh's image.
  BUN_VERSION: "1.4.4"
  ZIG_VERSION: "0.16.0"

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # next-version.sh reads the tags and the commits since the last one
          persist-credentials: false
      - id: version
        name: Compute the version
        run: |
          version=""
          if [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/main ]]; then
            version=$(scripts/next-version.sh)
          fi
          if [[ -n $version ]]; then
            release=true
          else
            version="0.0.0-dev.$GITHUB_RUN_NUMBER+${GITHUB_SHA::7}"
            release=false
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "release=$release" >>"$GITHUB_OUTPUT"
          echo "Version \`$version\` (release: $release)" >>"$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bun x biome ci --reporter=github .
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148,cargo-deny@0.20.2 # keep in line with `just setup`
      - name: Format
        run: cargo fmt --all --check
      - name: Code map is fresh
        run: scripts/gen-map.sh --check
      - name: Scripts
        run: |
          shellcheck scripts/*.sh
          scripts/next-version.test.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Generated TypeScript types are committed
        run: |
          if [[ -n $(git status --porcelain -- web/src/api/gen) ]]; then
            git status --short -- web/src/api/gen
            git diff -- web/src/api/gen
            echo "::error::web/src/api/gen is stale: run 'just gen' and commit the result"
            exit 1
          fi
      - name: cargo-deny
        run: cargo deny check

  build:
    name: build (${{ matrix.target }})
    needs: [version, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, arch: amd64 }
          - { target: i686-unknown-linux-musl, arch: "386" }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7, qemu: arm }
          - { target: aarch64-unknown-linux-musl, arch: arm64, qemu: arm64 }
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      UNIWRT_VERSION: ${{ needs.version.outputs.version }}
      UNIWRT_COMMIT: ${{ github.sha }}
      # Fails the build if the web UI is missing, so a release never ships the placeholder.
      UNIWRT_WEB_DIST: web/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Install the toolchain and the target
        run: rustup toolchain install && rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-zigbuild@0.23.4,cargo-auditable@0.7.7
      - name: Build
        # cargo-auditable embeds the dependency list, so the image SBOM and `cargo audit bin` see it.
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) cargo auditable zigbuild --release --locked --target "$TARGET"
      - if: matrix.qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.qemu }}
      - name: Smoke test
        run: |
          bin=target/$TARGET/release/uniwrt
          readelf -S "$bin" | grep -q '\.dep-v0' # the cargo-auditable data
          "$bin" version --json | tee version.json
          jq -e --arg target "$TARGET" --arg version "$UNIWRT_VERSION" \
            '.target == $target and .version == $version and .ui == "embedded"' version.json
          "$bin" serve --http-listen 127.0.0.1:18080 --data-dir "$RUNNER_TEMP/data" &
          pid=$!
          for _ in $(seq 60); do "$bin" healthcheck --http-listen 127.0.0.1:18080 2>/dev/null && break; sleep 0.5; done
          "$bin" healthcheck --http-listen 127.0.0.1:18080
          kill "$pid"
          wait "$pid" # graceful shutdown exits 0
      - name: Package
        run: |
          name=uniwrt-$UNIWRT_VERSION-$TARGET
          mkdir -p "pkg/$name" bin
          cp "target/$TARGET/release/uniwrt" LICENSE-MIT LICENSE-APACHE README.md "pkg/$name/"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
            -C pkg -cf - "$name" | gzip -9n >"$name.tar.gz"
          cp "target/$TARGET/release/uniwrt" "bin/uniwrt-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: bin/uniwrt-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: uniwrt-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [version, rust, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      # For the smoke test of the pushed image only: the build itself never emulates.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm,arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          # GitHub detects only Apache-2.0 in the repository; the project is dual-licensed.
          labels: org.opencontainers.image.licenses=MIT OR Apache-2.0
          annotations: org.opencontainers.image.licenses=MIT OR Apache-2.0
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/386,linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Smoke-test every platform
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        # Each platform runs by its own manifest digest: the runner's classic image store can't
        # hold two platforms pulled through the same index digest ("can not overwrite digest").
        run: |
          index=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Manifest}}')
          declare -A targets=(
            [linux/amd64]=x86_64-unknown-linux-musl [linux/386]=i686-unknown-linux-musl
            [linux/arm/v7]=armv7-unknown-linux-musleabihf [linux/arm64]=aarch64-unknown-linux-musl
          )
          for platform in "${!targets[@]}"; do
            IFS=/ read -r os arch variant <<<"$platform"
            digest=$(jq -er --arg os "$os" --arg arch "$arch" --arg variant "$variant" '
              [.manifests[] | select(.platform.os == $os and .platform.architecture == $arch
                and ($variant == "" or .platform.variant == $variant))] | .[0].digest' <<<"$index")
            docker run --rm --platform "$platform" "$IMAGE@$digest" version --json | tee version.json
            jq -e --arg target "${targets[$platform]}" --arg version "$VERSION" \
              '.target == $target and .version == $version and .ui == "embedded"' version.json
          done

  release:
    needs: [version, image]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum uniwrt-*.tar.gz | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/uniwrt-*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes
